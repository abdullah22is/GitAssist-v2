[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitassist"
version = "0.2.0"
description = "A smart and security-aware Git assistant"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Abdullah Abdulrahman Fadhel Bafadhel"}
]
keywords = ["git", "cli", "assistant", "security", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git"
]

[project.scripts]
gitassist = "gitassist.__main__:main"